# Seed sources. Loaded into the database on worker start (only sources not already there).
# After that, manage sources through the API (POST/PATCH /v1/sources) or MCP (add_source / update_source).
#
# Discovery channels, best first:
#   sitemap_url   Google News sitemap (or a sitemap index). Lists every article from the last ~48h.
#   rss_url       RSS/Atom feed. Adds summaries and images for the newest items.
#   listing_url   Section page to scan for article links (needs link_pattern). Fallback only.
#   homepage      With autodiscover: true, the engine finds RSS + news sitemaps itself (homepage <link> + robots.txt).
#
# default_category must be a value from taxonomy.yaml. interval_min = how often to check.

sources:
  - id: inc42
    name: Inc42
    homepage: https://inc42.com/
    sitemap_url: https://inc42.com/news-sitemap.xml        # from robots.txt, verified 2026-11-26
    rss_url: https://inc42.com/feed/
    region: India
    default_category: Startups
    interval_min: 15

  - id: techcrunch
    name: TechCrunch
    homepage: https://techcrunch.com/
    sitemap_url: https://techcrunch.com/news-sitemap.xml   # from robots.txt, verified 2026-11-26
    rss_url: https://techcrunch.com/feed/
    region: Global
    default_category: Big Tech
    interval_min: 15

  - id: yourstory
    name: YourStory
    homepage: https://yourstory.com/                       # RSS + sitemap found automatically
    region: India
    default_category: Startups
    interval_min: 20

  # ---- World and general news (verified 2026-11-27: news sitemap in robots.txt, User-agent * allowed) ----
  - id: aljazeera
    name: Al Jazeera
    homepage: https://www.aljazeera.com/
    sitemap_url: https://www.aljazeera.com/news-sitemap.xml
    region: Global
    default_category: World
    interval_min: 15

  - id: npr
    name: NPR
    homepage: https://www.npr.org/
    sitemap_url: https://googlecrawl.npr.org/news/sitemap_news.xml
    autodiscover: false            # www.npr.org times out from our host; the sitemap is on googlecrawl.npr.org
    region: US
    default_category: World
    interval_min: 15

  - id: euronews
    name: Euronews
    homepage: https://www.euronews.com/
    sitemap_url: https://www.euronews.com/news.xml
    region: Europe
    default_category: World
    interval_min: 15

  - id: wion
    name: WION
    homepage: https://www.wionews.com/
    sitemap_url: https://www.wionews.com/sitemaps/news-sitemap.xml
    region: Global
    default_category: World
    interval_min: 15

  - id: theprint
    name: ThePrint
    homepage: https://theprint.in/
    sitemap_url: https://theprint.in/googlenews.xml
    region: India
    default_category: Politics
    interval_min: 15

  - id: scroll
    name: Scroll
    homepage: https://scroll.in/
    sitemap_url: https://scroll.in/sitemap/news-sitemap.xml
    region: India
    default_category: Politics
    interval_min: 20

  - id: business-standard
    name: Business Standard
    homepage: https://www.business-standard.com/
    sitemap_url: https://www.business-standard.com/sitemap/news-sitemap.xml
    region: India
    default_category: Business
    interval_min: 15

  # ---- General sitemaps only: homepage given, the engine finds RSS + sitemap itself ----
  - id: cbs-news
    name: CBS News
    homepage: https://www.cbsnews.com/
    region: US
    default_category: World
    interval_min: 20

  - id: sky-sports
    name: Sky Sports
    homepage: https://www.skysports.com/
    region: UK
    default_category: Sports
    interval_min: 20

  - id: abc-australia
    name: ABC News (Australia)
    homepage: https://www.abc.net.au/news
    rss_url: https://www.abc.net.au/news/feed/51120/rss.xml   # its sitemaps are stale (last updated Jul 2026)
    autodiscover: false
    region: Australia
    default_category: World
    interval_min: 20

  - id: scmp
    name: South China Morning Post
    homepage: https://www.scmp.com/
    region: Asia-Pacific
    default_category: World
    interval_min: 20

  - id: sciencedaily
    name: ScienceDaily
    homepage: https://www.sciencedaily.com/
    region: Global
    default_category: Science
    interval_min: 30

  # Not added: blocked to our checks (BBC, Guardian, AP, Reuters-class outlets, The Hindu, HT, Indian Express, NDTV,
  # DW, CNA, Independent, Livemint, Moneycontrol, Firstpost, IGN, The Conversation, France24, Sportskeeda), paid bot access via
  # TollBit (Variety, Deadline), or articles closed to AI crawlers (phys.org, medicalxpress).

  # Add more by homepage alone; the engine discovers the rest. Examples to evaluate:
  # - {id: entrackr, name: Entrackr, homepage: https://entrackr.com/, region: India, default_category: Startups}
  # - {id: moneycontrol-startups, name: Moneycontrol, homepage: https://www.moneycontrol.com/, region: India, default_category: Markets}

# One-off changes to sources already in the database, applied once each on worker start (tracked by id).
# Use for operational fixes without the admin API. Keys: any source field (rss_url, sitemap_url, enabled, ...).
changes:
  - id: 2026-11-27-retire-sportskeeda
    source: sportskeeda
    set: {enabled: false}           # its sitemap refuses robots-respecting fetchers
  - id: 2026-11-27-abc-rss
    source: abc-australia
    set: {rss_url: "https://www.abc.net.au/news/feed/51120/rss.xml", sitemap_url: null, autodiscover: false}
  - id: 2026-11-27-npr-no-discovery
    source: npr
    set: {autodiscover: false}
